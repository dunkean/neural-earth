[package]
name = "neural-earth-wasm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "webgpu", "dx12", "vulkan", "metal"] }
futures-channel = "0.3"
half = "2"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = "thin"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
pollster = "0.4"
