[package]
name = "neural-earth-render"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
